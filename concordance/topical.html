<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topical Concordance A–Z — Aingel Chronicles</title>
<style>
body{background:#171208;color:#e8ddc4;font-family:Georgia,'Times New Roman',serif;margin:0;padding:0 1rem 3rem}
main{max-width:44rem;margin:0 auto}
h1{color:#c9a227;text-align:center;font-size:1.6rem;margin:1.2rem 0 .2rem}
.sub{text-align:center;color:#b8a888;font-style:italic;margin:0 0 1.2rem}
.nav{text-align:center;margin:1rem 0;line-height:1.9}
.nav a{color:#c9a227;text-decoration:none;margin:0 .3rem;font-size:1.05rem}
h2{color:#c9a227;border-bottom:1px solid #3a2f1d;padding-bottom:.2rem;margin-top:1.6rem}
.entry{margin:.8rem 0}
.term{font-weight:bold;color:#e8ddc4;font-size:1.05rem}
.gloss{color:#b8a888}
.refs{font-size:.95rem;line-height:1.7}
.refs a{color:#c9a227;text-decoration:none}
.refs a:hover{text-decoration:underline}
details{margin-top:.2rem}
summary{cursor:pointer;color:#c9a227}
.note{color:#b8a888;font-size:.9rem;text-align:center}
a{color:#c9a227}
</style>
</head>
<body>
<main>
<h1>Topical Concordance</h1>
<p class="sub">People, places, and terms of the canon — every reference machine-checked against the text.</p>
<p class="note">References follow the Standard wording; versification is identical in the Modern edition. Word forms are kept as written.</p>
<div class="nav" id="nav"></div>
<div id="entries"></div>
</main>
<script>
const SITE = '../standard/';
async function main(){
  const data = await (await fetch('../assets/concordance/topical.json')).json();
  const order = data.books_order;
  // book names come from the manifest
  const manifest = await (await fetch('../assets/concordance/manifest.json')).json();
  const names = manifest.book_names;
  const groups = {};
  data.entries.forEach(e => {
    const L = e.term[0].toUpperCase();
    (groups[L] = groups[L] || []).push(e);
  });
  const letters = Object.keys(groups).sort();
  document.getElementById('nav').innerHTML = letters.map(L => '<a href="#L' + L + '">' + L + '</a>').join('');
  let html = '';
  letters.forEach(L => {
    html += '<h2 id="L' + L + '">' + L + '</h2>';
    groups[L].forEach(e => {
      const shown = e.refs.slice(0, 12);
      const rest = e.refs.slice(12, 200);
      const refLink = r => {
        const slug = order[r[0]];
        const label = r[2] ? names[slug] + ' ' + r[1] + ':' + r[2] : names[slug] + ' ' + r[1];
        return '<a href="' + SITE + slug + '/' + r[1] + '.html">' + label + '</a>';
      };
      html += '<div class="entry"><span class="term">' + e.term + '</span> <span class="gloss">— ' + e.gloss + ' (' + e.count + ' verse' + (e.count === 1 ? '' : 's') + ')</span><div class="refs">' + shown.map(refLink).join(' · ');
      if(rest.length){
        html += ' <details><summary>all ' + e.count + ' references' + (e.count > 200 ? ' (showing first 200)' : '') + '</summary>' + rest.map(refLink).join(' · ') + '</details>';
      }
      html += '</div></div>';
    });
  });
  document.getElementById('entries').innerHTML = html;
}
main();
</script>
</body>
</html>
